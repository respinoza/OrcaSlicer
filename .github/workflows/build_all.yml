name: Build all

# Fork: builds the Windows installer and the x86_64 Flatpak on every push to the
# fork branches (no macOS/AppImage/aarch64, no schedule, no nightly deploy).
on:
  workflow_dispatch:
  push:
    branches: [ ci/flatpak-build, 'snorca/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Windows build stages the connect bundle itself via build_release_vs2022.bat.
  build_all:
    name: Build All
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: false
    secrets: inherit
  flatpak:
    name: "Flatpak"
    concurrency:
      group: flatpak-${{ matrix.variant.arch }}-${{ github.ref }}
      cancel-in-progress: false
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
      volumes:
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
        - /opt/ghc:/opt/ghc1
        - /usr/local/share/boost:/usr/local/share/boost1
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
            jobs: 4
    runs-on: ${{ matrix.variant.runner }}
    env:
      # Passed into orca_deps / Snapmaker_Orca flatpak modules (see deps/CMakeLists.txt FLATPAK NPROC cap).
      FLATPAK_BUILDER_N_JOBS: ${{ matrix.variant.jobs }}
      date:
      ver:
      ver_pure:
    steps:
    - name: "Remove unneeded stuff to free disk space"
      run:
        rm -rf /usr/local/lib/android/* /usr/share/dotnet/* /opt/ghc1/* "/usr/local/share/boost1/*"
    - uses: actions/checkout@v5
    - name: "Stage connect bundle"
      shell: bash
      run: |
        case "${{ matrix.variant.arch }}" in
          x86_64) platform="linux-x64" ;;
          aarch64) platform="linux-arm64" ;;
          *) echo "Unsupported Flatpak architecture: ${{ matrix.variant.arch }}" >&2; exit 1 ;;
        esac
        python3 scripts/packaging/stage_connect_bundle.py \
          --lock .github/connect-bundle.lock.json \
          --platform "$platform" \
          --resources-dir resources
    - name: Get the version and date
      run: |
        ver_pure=$(grep 'set(Snapmaker_VERSION' version.inc | cut -d '"' -f2)
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          ver="PR-${{ github.event.number }}"
        else
          ver=V$ver_pure
        fi
        echo "ver=$ver" >> $GITHUB_ENV
        echo "ver_pure=$ver_pure" >> $GITHUB_ENV
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
      shell: bash
    - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
      with:
        bundle: Snapmaker_Orca-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        manifest-path: scripts/flatpak/io.github.Snapmaker.Snapmaker_Orca.yml
        # App-only bundle (~140MB). Runtime org.gnome.Platform//49 is pulled from Flathub at install time.
        repository-url: https://flathub.org/repo/flathub.flatpakrepo
        repository-name: flathub
        # GNOME 49 upgrade: disable cache until green, then re-enable cache: true
        cache: true
        arch: ${{ matrix.variant.arch }}
        upload-artifact: false
    - name: Find Flatpak bundle file
      id: find_bundle
      working-directory: ${{ github.workspace }}
      run: |
        BUNDLE_NAME="Snapmaker_Orca-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak"
        # Try multiple possible locations
        if [ -f "$BUNDLE_NAME" ]; then
          BUNDLE_PATH="$(pwd)/$BUNDLE_NAME"
        elif [ -f "/__w/Snapmaker_Orca/Snapmaker_Orca/$BUNDLE_NAME" ]; then
          BUNDLE_PATH="/__w/Snapmaker_Orca/Snapmaker_Orca/$BUNDLE_NAME"
        else
          # Search in current directory and subdirectories
          FOUND=$(find . -name "$BUNDLE_NAME" -type f | head -1)
          if [ -z "$FOUND" ]; then
            echo "Error: Could not find $BUNDLE_NAME"
            echo "Searching for any .flatpak files:"
            find . -name "*.flatpak" -type f || true
            exit 1
          fi
          # Convert relative path to absolute
          BUNDLE_PATH="$(cd "$(dirname "$FOUND")" && pwd)/$(basename "$FOUND")"
        fi
        echo "path=$BUNDLE_PATH" >> $GITHUB_OUTPUT
        echo "Found bundle at: $BUNDLE_PATH"
        ls -lh "$BUNDLE_PATH" || true
      shell: bash

    - name: Upload artifacts Flatpak
      uses: actions/upload-artifact@v4
      with:
        name: Snapmaker_Orca-Linux-flatpak_${{ env.ver }}_${{ matrix.variant.arch }}.flatpak
        path: ${{ steps.find_bundle.outputs.path }}
        if-no-files-found: error
