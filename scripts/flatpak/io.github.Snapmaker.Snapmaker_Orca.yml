        dest: external-packages/FREETYPE

  - name: Snapmaker_Orca
    buildsystem: simple
    build-commands:
      - |
        set -euo pipefail
        export CMAKE_POLICY_VERSION_MINIMUM=3.5
        export FLATPAK_BUILDER_N_JOBS="${FLATPAK_BUILDER_N_JOBS:-4}"
        test -f /app/include/openvdb/version.h
        test -f /app/lib/libopenvdb.a -o -f /app/lib64/libopenvdb.a
        mkdir -p build_flatpak
        cmake . -B build_flatpak \
          -DSLIC3R_FHS=ON \
          -DSLIC3R_GTK=3 \
          -DSLIC3R_STATIC=ON \
          -DBUILD_TESTS=OFF \
          -DSLIC3R_DESKTOP_INTEGRATION=OFF \
          -DCMAKE_BUILD_TYPE=Release \
          -DFLATPAK=ON \
          -DBBL_RELEASE_TO_PUBLIC=1 \
          -DCMAKE_PREFIX_PATH=/app \
          -DCMAKE_INSTALL_PREFIX=/app \
          -DOPENVDB_ROOT=/app \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld"
        cmake --build build_flatpak --target Snapmaker_Orca -j"${FLATPAK_BUILDER_N_JOBS}"
        ./scripts/run_gettext.sh
        cmake --build build_flatpak --target install -j"${FLATPAK_BUILDER_N_JOBS}"

    cleanup:
      - /include

    post-install:
      # orca_deps installs static libs and headers into /app for SLIC3R_STATIC linking.
      # Module "cleanup:" only removes files installed by *this* module, so strip build-only
      # artifacts here (matches ~140MB Flathub bundles vs ~600MB if left in place).
      - |
        set -euo pipefail
        rm -rf /app/include
        # Not every dependency set installs into lib64; skip whichever is absent
        # (a missing path would make find fail under set -e).
        for _libdir in /app/lib /app/lib64; do
          [ -d "${_libdir}" ] || continue
          find "${_libdir}" -name '*.a' -delete
          find "${_libdir}" -name '*.la' -delete
        done
        rm -rf /app/lib/cmake /app/lib/pkgconfig /app/lib/debug
        rm -rf /app/lib64/cmake /app/lib64/pkgconfig
        rm -rf /app/share/doc /app/share/ECM /app/share/cmake /app/share/man /app/share/info
        for _tool in vdb_print qconvex qdelaunay qhalf qhull qvoronoi rbox openssl c_rehash curl-config env.sh wx-config wxrc wxrc-3.1 wxrc-3.3 draco_encoder draco_decoder draco_transcoder; do
          rm -f "/app/bin/${_tool}"
        done

      - | # Desktop Integration files
        # The fork ships no scalable app icon (resources/images/Snapmaker_Orca.svg does not
        # exist); the hicolor 32/128/192 px PNGs installed by CMake are renamed by rename-icon.
        if [ -f resources/images/Snapmaker_Orca.svg ]; then
          install -Dm644 -t /app/share/icons/hicolor/scalable/apps/ resources/images/Snapmaker_Orca.svg
        fi
        install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
        mv /app/share/applications/Snapmaker_Orca.desktop /app/share/applications/${FLATPAK_ID}.desktop
        desktop-file-edit --set-key=Exec --set-value="entrypoint %U" /app/share/applications/${FLATPAK_ID}.desktop
        install -Dm755 entrypoint /app/bin
        install -Dm755 umount /app/bin

      - install -Dm644 LICENSE.txt /app/share/licenses/${FLATPAK_ID}/LICENSE.txt

      - | # Install fonts into fontconfig-scanned directory so Pango finds them
        # before initialization (avoids ensure_faces crash from AddPrivateFont)
        install -Dm644 -t /app/share/fonts/Snapmaker_Orca/ resources/fonts/*.ttf
        fc-cache -f /app/share/fonts/Snapmaker_Orca/

    sources:
      # Snapmaker_Orca Source Archive (whole tree: keeps .git for GIT_COMMIT_HASH
      # and every fork directory the top-level CMakeLists.txt may reference)
      - type: dir
        path: ../../

      # AppData metainfo for GNOME Software & Co.
      - type: file
        path: io.github.Snapmaker.Snapmaker_Orca.metainfo.xml

      # Startup script
      - type: file
        path: entrypoint

      # umount wrapper used to redirect umount calls to UDisks2
      - type: file
        path: umount
