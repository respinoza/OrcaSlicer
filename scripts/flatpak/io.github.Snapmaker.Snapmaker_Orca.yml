app-id: io.github.Snapmaker.Snapmaker_Orca
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
command: entrypoint
separate-locales: true
rename-icon: Snapmaker_Orca
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-run/gvfs
  - --filesystem=/run/media
  - --filesystem=/media
  # Network shares (CIFS/NFS) are commonly mounted under /mnt, which the default
  # finish-args don't grant; without it, opening a model from such a share fails
  # with "The file does not contain any geometry data."
  - --filesystem=/mnt
  - --filesystem=/run/spnav.sock:ro
  # Allow Snapmaker_Orca to talk to other instances
  - --talk-name=io.github.Snapmaker.Snapmaker_Orca.InstanceCheck.*
  # Allow Snapmaker_Orca to own and talk to the instance-check D-Bus names it
  # actually uses (InstanceCheck.cpp: com.snapmaker.snapmaker-orca.InstanceCheck.Object<hash>)
  - --talk-name=com.snapmaker.snapmaker-orca.InstanceCheck.*
  - --own-name=com.snapmaker.snapmaker-orca.InstanceCheck.*
  - --system-talk-name=org.freedesktop.UDisks2
  - --env=SPNAV_SOCKET=/run/spnav.sock
  # Note: no keyring permission on purpose. The Snapmaker login token is
  # persisted via libsecret, which inside the sandbox automatically uses its
  # file backend + the Secret portal (org.freedesktop.portal.Secret), storing
  # the token in an encrypted per-app keyring -- so the app needs no
  # org.freedesktop.secrets access and cannot read other apps' secrets. Do not
  # pin SECRET_BACKEND=file: it is redundant while the portal is present and
  # turns the graceful no-portal fallback into a hard failure.

build-options:
  append-path: /usr/lib/sdk/llvm21/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
  env:
    CC: clang
    CXX: clang++
    LDFLAGS: "-fuse-ld=lld"
    CMAKE_POLICY_VERSION_MINIMUM: "3.5"

modules:

  # JPEG codec and GTK video sink (Wayland liveview) for the liveview
  - name: gst-plugins-good
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Djpeg=enabled
      - -Dgtk3=enabled
      - -Ddoc=disabled
      - -Dexamples=disabled
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.22.8.tar.xz
        sha256: e305b9f07f52743ca481da0a4e0c76c35efd60adaf1b0694eb3bb021e2137e39

  - name: glu
    build-options:
      cxxflags: -Wno-register
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/blfs/conglomeration/glu/glu-9.0.2.tar.xz
        sha256: 6e7280ff585c6a1d9dfcdf2fca489251634b3377bfc33c29e4002466a38d02d4
    cleanup:
      - /include
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig

  - name: kde-extra-cmake-modules
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/KDE/extra-cmake-modules
        tag: v5.249.0
        commit: 008ae77d0cd2a97c346228ab30b99279643e5022
    cleanup:
      - /

  - name: libspnav
    sources:
      - type: archive
        url: https://github.com/FreeSpacenav/libspnav/releases/download/v1.2/libspnav-1.2.tar.gz
        sha256: 093747e7e03b232e08ff77f1ad7f48552c06ac5236316a5012db4269951c39db

  # wxWidgets built as a separate module (no network at build time).
  # Config-opts mirror deps/wxWidgets/wxWidgets.cmake with FLATPAK=ON, DEP_WX_GTK3=ON.
  # ANY CHANGE TO THE wxWidgets VERSION OR BUILD ARGS THERE MUST BE REFLECTED HERE.
  - name: orca_wxwidgets
    buildsystem: cmake-ninja
    build-options:
      env:
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DwxBUILD_PRECOMP=ON
      - -DwxBUILD_TOOLKIT=gtk3
      - -DCMAKE_DEBUG_POSTFIX:STRING=d
      - -DwxBUILD_DEBUG_LEVEL=0
      - -DwxBUILD_SAMPLES=OFF
      - -DwxBUILD_SHARED=ON
      - -DBUILD_SHARED_LIBS=ON
      - -DwxUSE_MEDIACTRL=ON
      - -DwxUSE_DETECT_SM=OFF
      - -DwxUSE_PRIVATE_FONTS=ON
      - -DwxUSE_OPENGL=ON
      - -DwxUSE_GLCANVAS_EGL=ON
      - -DwxUSE_WEBREQUEST=ON
      - -DwxUSE_WEBVIEW=ON
      - -DwxUSE_WEBVIEW_EDGE=OFF
      - -DwxUSE_WEBVIEW_IE=OFF
      - -DwxUSE_REGEX=builtin
      - -DwxUSE_LIBSDL=OFF
      - -DwxUSE_XTEST=OFF
      - -DwxUSE_STC=OFF
      - -DwxUSE_AUI=ON
      - -DwxUSE_LIBPNG=sys
      - -DwxUSE_ZLIB=sys
      - -DwxUSE_LIBJPEG=sys
      - -DwxUSE_LIBTIFF=OFF
      # sys, not builtin (unlike the static deps build): wxWidgets installs the
      # builtin libwxwebp*.so only for static builds, so a shared build leaves
      # them missing at runtime. The GNOME runtime provides libwebp.
      - -DwxUSE_LIBWEBP=sys
      - -DwxUSE_EXPAT=sys
      - -DwxUSE_NANOSVG=OFF
      - -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
      - -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld
      - -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld
    sources:
      # Use git instead of archive: wxWidgets 3.3 relies on multiple git
      # submodules (PCRE2, etc.) that are not included in GitHub tarballs.
      - type: git
        url: https://github.com/SoftFever/Orca-deps-wxWidgets.git
        tag: orca-3.3.2
        commit: db1005db3dea2c37a46fb455a9a02e37aa360751
    cleanup:
      - "*.la"
      - "*.a"
      - "*.cmake"
      - /include
      - /app/bin/*

  # Snapmaker_Orca C++ dependencies (built offline with pre-downloaded archives)
  - name: orca_deps
    buildsystem: simple
    build-options:
      env:
        BUILD_DIR: deps/build_flatpak
    build-commands:
      # start build
      - |
        set -euo pipefail
        export CMAKE_POLICY_VERSION_MINIMUM=3.5
        export FLATPAK_BUILDER_N_JOBS="${FLATPAK_BUILDER_N_JOBS:-4}"
        cmake -S deps -B "${BUILD_DIR}" -G Ninja \
          -DDEP_WX_GTK3=ON \
          -DFLATPAK=ON \
          -DDEP_DOWNLOAD_DIR=/run/build/orca_deps/external-packages \
          -DCMAKE_PREFIX_PATH=/app \
          -DDESTDIR=/app \
          -DCMAKE_INSTALL_PREFIX=/app \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld"
        cmake --build "${BUILD_DIR}" -j"${FLATPAK_BUILDER_N_JOBS}"
        test -f /app/include/openvdb/version.h
        test -f /app/lib/libopenvdb.a -o -f /app/lib64/libopenvdb.a
        rm -rf /run/build/orca_deps/external-packages

    cleanup:
      # Keep headers and static libs in /app for the Snapmaker_Orca module (SLIC3R_STATIC=ON).
      - "*.la"
      - "/share/pkgconfig"

    sources:
      # Snapmaker_Orca deps/ directory only (avoids copying .git and keeps this
      # module cached across app-only changes). cmake/ comes along because
      # deps/CMakeLists.txt passes ${PROJECT_SOURCE_DIR}/../cmake/modules to
      # every dependency it builds.
      - type: dir
        path: ../../deps
        dest: deps
      - type: dir
        path: ../../cmake
        dest: cmake

      # ---------------------------------------------------------------
      # Pre-downloaded dependency archives
      # These are placed in external-packages/<Name>/ so CMake's
      # ExternalProject_Add finds them and skips network downloads.
      # NOTE: The url, dest folder name and sha256 must match Snapmaker_Orca's
      # cmake scripts and folder names in deps/.
